<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Testseiten</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0d0906" />
<style>
  :root{
    --ink:#0d0906; --card:#15100a; --gold:#d8b25f; --cream:#f6efe2;
    --dim:rgba(246,239,226,.6); --line:rgba(216,178,95,.16);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;background:var(--ink);color:var(--cream);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6;display:grid;place-items:center;padding:2rem 1.2rem;
  }
  main{width:min(680px,100%)}
  h1{
    margin:0 0 .5rem;font-weight:400;letter-spacing:-.02em;
    font-size:clamp(1.7rem,5vw,2.6rem);
  }
  .lead{color:var(--dim);margin:0 0 2.5rem;font-size:.98rem}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
  a.card{
    display:flex;align-items:center;gap:1.1rem;padding:1.2rem 1.3rem;
    border:1px solid var(--line);border-radius:14px;background:var(--card);
    color:inherit;text-decoration:none;
    transition:border-color .3s,transform .3s,background .3s;
  }
  a.card:hover{border-color:rgba(216,178,95,.4);transform:translateY(-2px);background:#191309}
  a.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .thumb{
    width:52px;height:52px;flex:0 0 52px;border-radius:50%;object-fit:cover;
    background:#000;
  }
  .body{display:flex;flex-direction:column;flex:1;min-width:0}
  .body strong{font-weight:600}
  .body span{font-size:.86rem;color:var(--dim)}
  .arrow{color:var(--gold);flex:0 0 auto;font-size:1.1rem}
  footer{margin-top:2.6rem;font-size:.8rem;color:var(--dim)}
</style>
</head>
<body>
<main>
  <h1>Testseiten</h1>
  <p class="lead">
    Muster-Auftritte für Betriebe. Nicht öffentlich beworben, nicht indexiert —
    zum Anschauen und Herzeigen.
  </p>

  <ul>
    <li>
      <a class="card" href="bilad-alsham/">
        <img class="thumb" src="bilad-alsham/assets/logo.webp" width="52" height="52" alt="" />
        <span class="body">
          <strong>Bilad Alsham</strong>
          <span>Arabische Konditorei, Osnabrück</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>

  <footer>Iburger Straße 17, 49082 Osnabrück · Muster, kein Auftritt des Betriebs</footer>
</main>
</body>
</html>
